<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGNITION 1.0 | U-KRITI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260916">
  <style>
    /* Critical Full-Bleed & Layout Safeguards */
    html, body { margin: 0; padding: 0; width: 100vw; overflow-x: hidden; }
    .split-container { width: 100vw !important; height: 100vh !important; position: fixed !important; top: 0 !important; left: 0 !important; display: flex !important; }
    .panel { width: 50% !important; height: 100% !important; position: relative !important; overflow: hidden !important; }
    .bg-image {
      position: absolute !important;
      top: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background-image: url('assets/images/pixel-art-desktop.jpg') !important;
      background-size: cover !important;
      background-position: center center !important;
      background-repeat: no-repeat !important;
    }
    .left-panel .bg-image { left: 0 !important; }
    .right-panel .bg-image { left: -50vw !important; }
    @media (max-width: 767px) {
      .bg-image { background-image: url('assets/images/pixel-art-mobile.jpg') !important; }
    }
    .main-title { font-size: clamp(2.2rem, 5.5vw, 4.2rem) !important; max-width: 95vw !important; word-break: break-word !important; }
    .events-container { max-width: 100vw !important; box-sizing: border-box !important; padding: 0 1rem !important; }
    .event-choice { max-width: 320px !important; transform: none !important; margin: 0 !important; }
    .event-choice:hover { transform: translateY(-4px) !important; }
  </style>
</head>
<body>
  
  <!-- SPLIT SCREEN BACKGROUND -->
  <div class="split-container fade-in-bg">
    <div class="panel left-panel">
      <div class="bg-image"></div>
    </div>
    <div class="panel right-panel">
      <div class="bg-image"></div>
    </div>
    <div class="vignette-overlay"></div>
  </div>

  <!-- UI LAYER -->
  <div class="ui-layer">
    
    <!-- NAVIGATION -->
    <header class="navbar fade-in-nav">
      <!-- Empty spacer so space-between pushes the logo to the right -->
      <div></div>
      
      <div class="logo-container">
        U-KRITI
      </div>
    </header>

    <!-- MAIN HERO CONTENT -->
    <main class="main-content">
      <div class="hero-info">
        <div class="overline fade-in-info">
          <span class="brand">U-KRITI</span><br>
          <span class="desc">ENTREPRENEURSHIP & BUSINESS STRATEGY</span>
        </div>
        
        <h1 class="main-title fade-in-title">IGNITION 1.0</h1>
        
        <div class="tagline fade-in-info">
          <span class="tag-primary">WHERE IDEAS IGNITE.</span><br>
          <span class="tag-secondary">Businesses evolve.</span>
        </div>
        
        <div class="datetime fade-in-info">
          <span class="date">23 SEPTEMBER 2026</span>
          <span class="time">9:00 AM – 3:30 PM</span>
        </div>
      </div>

      <!-- EVENT CHOICES -->
      <div class="events-container fade-in-choices">
        <a href="reventure.html" class="event-choice re-venture">
          <div class="choice-content">
            <h2 class="choice-title">RE:VENTURE</h2>
            <p class="choice-desc">Solve. Negotiate. Adapt.</p>
          </div>
          <div class="hover-accent"></div>
        </a>
        
        <div class="event-separator"></div>
        
        <a href="venturegazette.html" class="event-choice venture-gazette">
          <div class="choice-content">
            <h2 class="choice-title">VENTURE GAZETTE</h2>
            <p class="choice-desc">Observe. Identify. Create.</p>
          </div>
          <div class="hover-accent"></div>
        </a>
      </div>
    </main>

    <!-- SUBTLE PIXEL UI DECORATIONS (Removed) -->
  </div>

  <script src="script.js"></script>
</body>
</html>
